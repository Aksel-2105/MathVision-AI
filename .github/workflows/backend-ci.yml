name: Backend CI

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: .

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e backend[dev]
      - name: Ruff
        run: python -m ruff check backend
      - name: Mypy
        run: python -m mypy backend/app
      - name: Tests
        run: python -m pytest backend/tests --cov=backend/app --cov-report=term-missing
