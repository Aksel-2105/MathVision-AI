services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mathvision}
      POSTGRES_USER: ${POSTGRES_USER:-mathvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathvision}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mathvision} -d ${POSTGRES_DB:-mathvision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-MathVision AI API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_DIR: ${UPLOAD_DIR:-data/runtime/uploads}
      PROCESSED_DIR: ${PROCESSED_DIR:-data/runtime/processed}
      MODEL_DIR: ${MODEL_DIR:-data/runtime/models}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-25000000}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mathvision}:${POSTGRES_PASSWORD:-mathvision}@db:5432/${POSTGRES_DB:-mathvision}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
