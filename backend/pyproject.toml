[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathvision-ai-backend"
version = "0.1.0"
description = "FastAPI foundation for MathVision AI"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<12",
  "pywavelets>=1.7,<2",
  "scikit-image>=0.24,<1",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
"app/imaging/algorithms.py" = ["E501"]
"app/api/routes/experiments.py" = ["B008"]
"app/api/routes/mathematical_analysis.py" = ["E501"]
"app/mathematics/compression_potential.py" = ["E501"]
"app/mathematics/dct_analysis.py" = ["E501"]
"app/mathematics/descriptive_statistics.py" = ["E501"]
"app/mathematics/frequency_analysis.py" = ["E501"]
"app/mathematics/gradients.py" = ["E501"]
"app/mathematics/information_theory.py" = ["E501"]
"app/mathematics/linear_algebra.py" = ["E501"]
"app/mathematics/local_analysis.py" = ["E501"]
"app/mathematics/noise_analysis.py" = ["E501"]
"app/mathematics/probability.py" = ["E501"]
"app/mathematics/texture_analysis.py" = ["E501"]
"app/mathematics/wavelet_analysis.py" = ["E501"]
"app/services/mathematical_analysis_service.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
